<!-- No @font-face here on purpose (previous version loaded Syne from
     fonts.gstatic.com) -- favicons render in a restricted context where
     external requests are unreliable, so a remote font load either silently
     fails (blank icon) or just never fires for non-browser consumers
     entirely. Falls back through the system's own bold sans stack instead;
     "ee" reads fine at favicon size regardless of exact typeface. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <text
    x="32"
    y="35"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="800"
    font-size="38"
    letter-spacing="-2"
    fill="#8B6914"
  >ee</text>
</svg>
